("p",{children:"No attempts to get around access rules, no malware, no use for anything unlawful, and no sharing of sign in details."}),s.jsx("h4",{children:"7. Ending use"}),s.jsx("p",{children:"A client may close its rooms or end its use of Astranos. What happens to stored records is described in the privacy notice. [Notice periods and export rights to be set by the attorney.]"}),s.jsx("h4",{children:"8. Disclaimers and liability"}),s.jsx("p",{children:"[To be written by the attorney: warranties, limits of liability, indemnities.]"}),s.jsx("h4",{children:"9. Law and contact"}),s.jsx("p",{children:"[Governing law and venue.] Questions: [contact email]."})]})}function UN(){return s.jsxs(s.Fragment,{children:[s.jsx(fy,{}),s.jsx("h4",{children:"What we collect"}),s.jsx("p",{children:"Your name, work email, firm and role; that you set up an authenticator (not your codes); the devices you sign in from (a fingerprint of the device and its browser description) and when; what you upload and post in the rooms you are invited to; and an audit log of actions in each room (views, downloads, changes). Our hosting providers keep technical logs, including IP addresses. If something breaks while you are signed in, the app reports the error message, the screen and the build, linked to your account, with addresses, quoted text, amounts, emails and numbers blanked out."}),s.jsx("h4",{children:"Why"}),s.jsx("p",{children:"To run the deal rooms you are invited to, keep them secure, show each party only what their access level allows, send you alerts about your rooms, and keep the record of the deal the parties rely on."}),s.jsx("h4",{children:"Who processes it for us"}),s.jsx("p",{children:"Supabase (database, sign in, file storage), Cloudflare (hosting the app) and Resend (sending alert emails). The app loads nothing from any other service and has no analytics or advertising."}),s.jsx("h4",{children:"Who can see it"}),s.jsx("p",{children:"The parties in your rooms, at their access level. Your firm's admins, who manage people and rooms and see each room's title, stage and amount, but not its messages or documents. Astranos operators, who manage accounts and access; they see inside a room by joining it, which the room sees and records, or when they export a client's records (for example when the client leaves), which every room's audit log records. Messages and files are encrypted in transit and at rest but not end to end: people with administrator access to the database can read them."}),s.jsx("h4",{children:"How long we keep it"}),s.jsx("p",{children:"For as long as the client keeps the rooms. When a client is deleted, its rooms and files are deleted; database backups keep them until those backups age out. [Retention periods to be confirmed by the attorney.]"}),s.jsx("h4",{children:"Your choices"}),s.jsx("p",{children:"You can ask your firm's admin, or us at [contact email], to see, correct or delete your information, subject to what a deal's record must keep. [Rights under applicable law to be listed by the attorney.]"})]})}function WN({which:t,onClose:e}){const i=t==="terms"?s.jsx(_N,{}):s.jsx(UN,{});return s.jsxs(pt,{title:t==="terms"?"Terms of use (draft)":"Privacy notice (draft)",onClose:e,wide:!0,children:[s.jsx("div",{className:"legal",children:i}),s.jsx("div",{className:"modal-acts",children:s.jsx("button",{type:"button",className:"btn",onClick:e,children:"Close"})})]})}const HN=[["key","Signing in",["Every account needs a password and a 6 digit code from an authenticator app on your phone. The database itself refuses everything without both.","You are signed out after 12 hours, and the app locks after 15 minutes away. You can see your signed in devices and sign any of them out.","A lost authenticator is reset only after an admin confirms it's you by phone and reads you a one time code."]],["lock","Encryption",["Everything travels encrypted (HTTPS) and is stored encrypted on disk by our database provider.","It is not end to end encrypted: the service can read what is stored, and so could its database administrator. That access is limited to Astranos's founder."]],["people","Who can see what",["Nobody sees a room without being in it, and each person has an access level: full, investor, counsel or escrow.","Investors never see each other: not names, messages, amounts, documents or questions.","These rules live in the database, on every row, not just in the screens. Astranos staff can see a room's contents only by joining it as a party, which is announced in the room's chat and written to its audit log."]],["bank","Wire instructions",["Astranos never holds or moves money. It shows masked instructions (last 4 digits only).","A change needs escrow to propose it and a second person to confirm it after a phone call, and every party gets a red warning.","The waits are fraud protection. A proposed change can't be confirmed for 24 hours, so everyone in the room sees it first and can object. Someone newly given escrow access, or newly named the approver, waits 72 hours before they can propose or confirm, because a new or taken over account is how this fraud usually starts. The app counts each wait down, and the emails about new escrow access, a new approver or a proposed change give the exact time it ends. Nobody can shorten them in the app: the database refuses anything early.","Got an email asking you to send funds somewhere new? Report it from the room's chat or Help. Every party can, and the whole room is warned.","Always confirm instructions by phone, at a number you already have, before sending money. Never trust an email about a new account."]],["ledger","The record",["Every view, upload, download, approval and funding step made in the app goes in the room's audit log, written by the database. Nobody can edit it, and it is only ever deleted with a whole client, 30 days after the client is closed.","The log is a hash chain: a change or removal shows when the chain is checked. Documents carry your name a
